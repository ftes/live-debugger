name: Playwright

on:
  push:
    branches:
      - main
      - "v*.*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir-version: "1.19.1"
            otp-version: "28.1.1"
            backward-compatibility: false

    steps:
      - uses: actions/checkout@v4

      - name: Install inotify-tools
        run: sudo apt-get update && sudo apt-get install -y inotify-tools

      - name: Set up Elixir
        uses: erlef/setup-beam@v1.20.4
        with:
          elixir-version: ${{ matrix.elixir-version }} # [Required] Define the Elixir version
          otp-version: ${{ matrix.otp-version }} # [Required] Define the Erlang/OTP version

      - name: Copy mix.lock for backward compatibility
        if: ${{ matrix.backward-compatibility }}
        run: cp ./.github/workflows/assets/mix.lock mix.lock

      - name: Cache Mix
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ matrix.backward-compatibility && 'backward-compatibility-' || '' }}${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ matrix.backward-compatibility && 'backward-compatibility-' || '' }}${{ runner.os }}-mix-

      - name: Install Mix Dependencies
        run: mix deps.get

      # mix.lock pins the playwright_ex driver and so the browser revisions
      - name: Cache Playwright
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/playwright
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('mix.lock') }}

      - name: Install Playwright Dependencies
        run: MIX_ENV=test mix playwright.install -- chromium firefox --with-deps

      # The ExUnit port in test/e2e_pw; `mix test --failed` is Playwright Test's retry
      - name: Run Playwright tests
        run: |
          E2E=1 mix test --only e2e || { [ $? -eq 2 ] && E2E=1 mix test --only e2e --failed; }

      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: test-results
          path: test-results/
          retention-days: 1
